<ion-header class="ion-no-border shell-header">
  <ion-toolbar class="shell-brand">
    @if (showBack) {
      <ion-buttons slot="start">
        <ion-back-button [defaultHref]="defaultHref" text=""></ion-back-button>
      </ion-buttons>
    }
    <div class="brand" [class.brand-inline]="showBack" [class.brand-pad]="!showBack">
      @if (!showBack) {
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="36" height="36">
            <rect width="32" height="32" rx="8" fill="currentColor"/>
            <circle cx="8" cy="22" r="2.2" fill="#f7f4ee"/>
            <circle cx="16" cy="16" r="2.2" fill="#f7f4ee"/>
            <circle cx="24" cy="10" r="2.2" fill="#f7f4ee"/>
            <path d="M9.8 20.6 14.2 17.4M17.8 14.8 22.1 11.6"
                  stroke="#f7f4ee" stroke-width="1.7" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
      }
      <div class="brand-text">
        <span class="brand-name">{{ title }}</span>
        <span class="brand-sub">{{ subtitle }}</span>
      </div>
    </div>
  </ion-toolbar>

  @if (!hideNav) {
    <div class="shell-nav">
      <nav class="nav-scroll" aria-label="Seções">
        @for (item of items; track item.path) {
          <a
            class="nav-item"
            [class.ativo]="item.ativo"
            [routerLink]="item.path"
            routerDirection="root"
            [attr.aria-current]="item.ativo ? 'page' : null"
          >
            <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
            <span>{{ item.label }}</span>
          </a>
        }
        <button type="button" class="nav-item nav-gear" aria-label="Configurações" (click)="abrirConfig()">
          <ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
        </button>
      </nav>
    </div>
  }
</ion-header>
